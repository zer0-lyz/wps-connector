lex:0 0 auto;min-height:0;display:flex;flex-direction:column;overflow:visible}.binding-card[open]{display:flex}.binding-form{display:grid;gap:8px;padding:0 10px 10px;min-width:0;overflow:visible;min-height:0}.field-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-width:0}.field-header button{min-height:28px;padding:4px 8px}.binding-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;min-width:0}.feedback{min-height:18px;color:#57606a;font-size:12px}summary{padding:8px 10px;cursor:default;font-weight:650;flex:0 0 auto}input{width:100%;max-width:100%;min-width:0;padding:8px;border:1px solid #d0d7de;border-radius:6px;font:inherit;background:#fff}.picker{position:relative;width:100%;max-width:100%;min-width:0}.picker.open{z-index:40}.picker-button{display:block;width:100%;max-width:100%;min-width:0;min-height:40px;padding:7px 32px 7px 9px;position:relative;color:#24292f;border-color:#d0d7de;background:#fff;text-align:left}.picker-button::after{content:"⌄";position:absolute;top:50%;right:10px;color:#57606a;transform:translateY(-50%)}.picker.open .picker-button::after{content:"⌃"}.picker-button-title,.picker-button-meta,.picker-option-title,.picker-option-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picker-button-title{display:block;font-weight:650;line-height:18px}.picker-button-meta{display:block;margin-top:2px;color:#57606a;font-size:12px}.picker-menu{position:static;display:grid;gap:6px;margin-top:6px;padding:8px;border:1px solid #d0d7de;border-radius:8px;background:#fff;box-shadow:none}.picker-menu[hidden]{display:none}.picker-list{display:grid;gap:5px;height:var(--picker-list-height,220px);max-height:var(--picker-list-height,220px);overflow-y:auto;overflow-x:hidden;padding-right:2px;padding-bottom:14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.picker-option{display:grid;gap:2px;width:100%;min-height:48px;padding:7px 8px;border:1px solid transparent;border-radius:6px;background:#fff;color:#24292f;text-align:left;align-content:center}.picker-option:hover{border-color:#d0d7de;background:#f6f8fa}.picker-option.selected{border-color:#0969da;background:#ddf4ff}.picker-option-title{display:block;font-weight:650;line-height:18px}.picker-option-meta{display:block;color:#57606a;font-size:12px;line-height:16px}.muted{color:#6b7280}.hidden-fields{display:none}
.status-card{align-items:start}.status-card>.wide{align-self:start}.selection-row{min-height:0}.selection-row>div{min-height:0}.selection-text{min-height:18px;max-height:48px;overflow:auto}

<body>
<main>
  <header><div><h1>WPS Connector</h1><p id="statusText">等待 WPS 初始化</p><p id="versionText">版本 -</p></div><div class="header-actions"><button id="refreshAll" type="button">刷新</button></div></header>
  <section class="status-card">
    <div><span class="label">Host</span><strong id="hostValue">-</strong></div>
    <div><span class="label">当前文档</span><strong id="docValue">-</strong></div>
    <div><span class="label">绑定状态</span><strong id="bindingValue">未绑定</strong></div>
    <div><span class="label">Session</span><strong id="sessionValue">未注册</strong></div>
    <div class="wide selection-row"><div><span class="label">当前选区</span><strong id="contextValue" class="muted selection-text">-</strong></div><div class="selection-actions"><button id="confirmScope" type="button">确认选定区域</button><button id="clearScope" type="button" class="secondary" hidden>取消限定</button></div></div><div class="wide"><span class="label">操作范围</span><strong id="scopeValue" class="muted">整个文档/表格</strong></div>
  </section>
  <details class="binding-card" open>
    <summary>项目绑定</summary>
    <section class="binding-form">
      <div class="field-header"><label for="projectPickerButton">选择 Codex 项目</label><button id="refreshProjects" type="button" class="secondary">刷新</button></div>
      <div class="picker" id="projectPicker"><button id="projectPickerButton" class="picker-button" type="button">加载项目列表...</button><div id="projectPickerMenu" class="picker-menu" hidden><input id="projectFilter" placeholder="搜索项目名称或路径"><div id="projectPickerList" class="picker-list"></div></div></div>
      <div class="field-header"><label for="threadPickerButton">选择对话</label><button id="refreshThreads" type="button" class="secondary">刷新</button></div>
      <div class="picker" id="threadPicker"><button id="threadPickerButton" class="picker-button" type="button">加载对话列表...</button><div id="threadPickerMenu" class="picker-menu" hidden><input id="threadFilter" placeholder="搜索对话标题"><div id="threadPickerList" class="picker-list"></div></div></div>
      <div class="hidden-fields"><input id="projectName"><input id="projectPath"><input id="threadId"><input id="documentRole"></div>
      <div class="binding-actions"><button id="saveBinding" type="button">保存绑定</button><button id="clearBinding" type="button" class="secondary">清除绑定</button></div>
      <div id="actionFeedback" class="feedback">等待加载。</div>
    </section>
  </details>
  <section class="update-card" id="updateCard">
    <div class="update-head"><div><span class="label">更新设置</span><strong id="updateStatus">未检查更新</strong><p id="updateMeta">可检查 GitHub main 上的新版本。安装后需要重启 WPS 才能加载新版插件。</p></div><div class="update-actions"><button id="checkUpdate" type="button" class="secondary">检查更新</button><button id="applyUpdate" type="button" hidden>下载并安装</button><button id="skipUpdate" type="button" class="secondary" hidden>跳过该版本</button></div></div>
  </section>
</main>

<script>
const WPS_CONNECTOR_PANE_VERSION="1.0.70";
const WPS_CONNECTOR_UPDATE_SKIP_KEY="wpsConnectorSkippedUpdateVersion";
const $=(id)=>document.getElementById(id);const state={projects:[],threads:[],sessions:[],catalogUpdatedAt:"",catalogSource:"",binding:null,drafts:{},menuOpen:false,update:null};
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));}
function normPath(v){return String(v||"").replace(/\/$/,"");}
function compactPath(v){const s=String(v||"");if(s.length<=48)return s;const parts=s.split("/").filter(Boolean);return parts.length>2?`.../${parts.slice(-2).join("/")}`:`...${s.slice(-42)}`;}
function titlePreview(v){const s=String(v||"").replace(/\s+/g," ").trim();return s.length>60?`${s.slice(0,57)}...`:s;}
function threadTitle(it){return titlePreview(it?.threadTitle||it?.displayTitle||it?.title||it?.preview||it?.threadId||it?.id||"");}
function pickerHtml(title,meta){return `<span class="picker-button-title">${esc(title||"未选择")}</span>${meta?`<span class="picker-button-meta">${esc(meta)}</span>`:""}`;}
function paneDocumentKey(){try{return new URLSearchParams(location.search).get("doc")||"";}catch{return"";}}
function activeSession(){const cur=window.wpsConnectorSessionInfo||{};const key=cur.documentKey||paneDocumentKey();return state.sessions.find(s=>(cur.sessionId&&s.sessionId===cur.sessionId)||(key&&s.documentKey===key))||cur||null;}
function currentBinding(){return activeSession()?.binding||state.binding||null;}function currentDocumentLabel(){const s=activeSession()||{};return s.documentName||s.documentKey||paneDocumentKey()||"-";}
function activeSessionKey(){const s=activeSession()||{};return s.sessionId||s.documentKey||paneDocumentKey()||"global";}
function currentDraft(){const k=activeSessionKey();state.drafts[k]=state.drafts[k]||{project:null,thread:null};return state.drafts[k];}
function selectedProject(){const b=currentBinding()||{};const d=currentDraft();return d.project||state.projects.find(p=>p.projectId===b.projectId||p.path===b.projectPath)||null;}
function formatContext(s){if(!s)return"-";const c=s.activeContext||{};if(c.error)return`读取失败：${c.error}`;if(s.host==="et"){const head=`${c.sheetName||""} ${c.address||""}`.trim();return [head,c.textPreview].filter(Boolean).join("\n")||"-";}if(s.host==="wpp"){const range=Number.isFinite(Number(c.start))&&Number.isFinite(Number(c.end))?`位置 ${c.start}-${c.end}`:"";return [`${c.length||0} chars selected`,range,c.textPreview].filter(Boolean).join("\n")||"-";}return JSON.stringify(c);}
function formatScope(s){const scope=s?.operationScope||{};if(scope.mode!=="selection")return"整个文档/表格";const c=scope.context||{};if(s.host==="et")return `限定选区：${[c.sheetName,c.address].filter(Boolean).join(" ")}`;if(s.host==="wpp")return `限定选区：${c.start??"?"}-${c.end??"?"} · ${c.length||0} chars`;return"限定选区";}
function setFeedback(t){$("actionFeedback").textContent=t||"";}function setStatus(t){$("statusText").textContent=t||"";}
function skippedUpdateVersion(){try{return localStorage.getItem(WPS_CONNECTOR_UPDATE_SKIP_KEY)||"";}catch{return"";}}
function setSkippedUpdateVersion(v){try{v?localStorage.setItem(WPS_CONNECTOR_UPDATE_SKIP_KEY,v):localStorage.removeItem(WPS_CONNECTOR_UPDATE_SKIP_KEY);}catch{}}
function renderUpdatePanel(){const u=state.update||{};const cur=u.current?.version||WPS_CONNECTOR_PANE_VERSION;const latest=u.latest?.version||"";const skipped=latest&&latest===skippedUpdateVersion();let status=`当前版本 v${String(cur).replace(/^v/,"")}`;let meta="点击检查更新以查询 GitHub main。安装后需要重启 WPS 才能生效。";if(u.updateAvailable){status=skipped?`已跳过版本 v${latest}`:`发现新版本 v${latest}`;meta=`当前 v${cur} · 最新 v${latest}${u.latest?.build?` · ${u.latest.build}`:""} · 安装后请重启 WPS`;}else if(u.warning){status="远程检查失败";meta=u.warning.message||"无法连接更新源，请稍后重试。";}else if(u.checkedAt){status=`当前已是最新版本 v${cur}`;meta=`检查时间 ${u.checkedAt}`;}$("updateStatus").textContent=status;$("updateMeta").textContent=meta;$("applyUpdate").hidden=!(u.updateAvailable&&!skipped);$("skipUpdate").hidden=!u.updateAvailable;$("skipUpdate").textContent=skipped?"取消跳过":"跳过该版本";}
function renderHeader(){const s=activeSession()||{};const b=currentBinding();const v=s.clientVersion||window.wpsConnectorSessionInfo?.clientVersion||WPS_CONNECTOR_PANE_VERSION;$("hostValue").textContent=s.host||window.wpsConnectorSessionInfo?.host||"-";$("docValue").textContent=currentDocumentLabel();$("bindingValue").textContent=b?.projectName||b?.projectPath||b?.threadId||b?.projectId?"已绑定":"未绑定";$("sessionValue").textContent=s.sessionId||window.wpsConnectorSessionInfo?.sessionId||"未注册";$("contextValue").textContent=formatContext(s);$("scopeValue").textContent=formatScope(s);const limited=s.operationScope?.mode==="selection";$("confirmScope").textContent=limited?"更新选定区域":"确认选定区域";$("clearScope").hidden=!limited;$("versionText").textContent=`版本 v${String(v).replace(/^v/,"")}`;renderUpdatePanel();}
function filteredProjects(){const f=$("projectFilter")?.value.trim().toLowerCase()||"";return state.projects.filter(it=>!f||[it.label,it.path,it.projectId].some(v=>String(v||"").toLowerCase().includes(f)));}
function projectThreads(){const p=selectedProject();if(!p)return state.threads;const path=normPath(p.path||p.projectId);return state.threads.filter(it=>normPath(it.cwd)===path);}
function filteredThreads(){const f=$("threadFilter")?.value.trim().toLowerCase()||"";return projectThreads().filter(it=>!f||[it.threadTitle,it.displayTitle,it.title,it.preview,it.cwd,it.id].some(v=>String(v||"").toLowerCase().includes(f)));}
function selectedThread(){const d=currentDraft();const id=d.thread?.id||currentBinding()?.threadId||"";if(!id)return d.thread||null;return projectThreads().find(x=>x.id===id)||state.threads.find(x=>x.id===id)||d.thread||null;}
function renderPickers(){renderProjects();renderThreads();const p=selectedProject();$("projectPickerButton").innerHTML=p?.projectName||p?.label||p?.projectId?pickerHtml(p.projectName||p.label||p.projectId,compactPath(p.projectPath||p.path)):pickerHtml(state.projects.length?"不指定项目":"加载项目列表...",state.projects.length?"点击选择本机 Codex 项目":"");const t=selectedThread();$("threadPickerButton").innerHTML=t?.threadId||t?.id?pickerHtml(threadTitle(t),compactPath(t.threadCwd||t.cwd)):pickerHtml(filteredThreads().length?"不指定对话":"无可选对话",selectedProject()?"仅显示当前项目下的对话":"请先选择项目以缩小范围");}
function renderProjects(){const items=filteredProjects();$("projectPickerList").innerHTML=`<button class="picker-option ${!selectedProject()?"selected":""}" type="button" data-index="-1"><span class="picker-option-title">不指定项目</span><span class="picker-option-meta">仅绑定当前文档</span></button>`+items.map((it,i)=>`<button class="picker-option ${selectedProject()?.projectId===it.projectId?"selected":""}" type="button" data-index="${i}"><span class="picker-option-title">${esc(it.label||it.projectId)}</span><span class="picker-option-meta">${esc(compactPath(it.path||it.projectId||""))}</span></button>`).join("");$("projectPickerList").querySelectorAll("button").forEach(el=>el.onclick=()=>{const idx=Number(el.dataset.index);const d=currentDraft();d.project=idx<0?null:items[idx];d.thread=null;closePicker("projectPickerMenu");renderPickers();setFeedback(currentDraft().project?`已选择项目：${currentDraft().project.label||currentDraft().project.projectId}`:"已清除项目选择");});}
function renderThreads(){const items=filteredThreads();const current=selectedThread();$("threadPickerList").innerHTML=`<button class="picker-option ${!currentDraft().thread&&!currentBinding()?.threadId?"selected":""}" type="button" data-index="-1"><span class="picker-option-title">不指定对话</span><span class="picker-option-meta">仅绑定项目或文档</span></button>`+items.map((it,i)=>`<button class="picker-option ${current?.id===it.id?"selected":""}" type="button" data-index="${i}"><span class="picker-option-title">${esc(threadTitle(it)||it.id)}</span><span class="picker-option-meta">${esc(compactPath(it.cwd||it.id||""))}</span></button>`).join("");$("threadPickerList").querySelectorAll("button").forEach(el=>el.onclick=()=>{const idx=Number(el.dataset.index);currentDraft().thread=idx<0?null:items[idx];closePicker("threadPickerMenu");renderPickers();setFeedback(currentDraft().thread?`已选择对话：${threadTitle(currentDraft().thread)||currentDraft().thread.id}`:"已清除对话选择");});}
function fitPicker(id){const menu=$(id);if(!menu||menu.hidden)return;menu.scrollIntoView({block:"nearest",inline:"nearest"});const list=menu.querySelector(".picker-list");if(!list)return;const top=list.getBoundingClientRect().top;const available=Math.max(96,window.innerHeight-top-18);list.style.setProperty("--picker-list-height",`${Math.min(260,available)}px`);}
function openPicker(id,inputId){closePicker(id==="projectPickerMenu"?"threadPickerMenu":"projectPickerMenu");state.menuOpen=true;$(id).hidden=false;$(id).closest(".picker")?.classList.add("open");if(id==="threadPickerMenu")fetchCatalog(true).catch(e=>setFeedback(e.message||String(e)));setTimeout(()=>{fitPicker(id);$(inputId)?.focus({preventScroll:true});},0);}function closePicker(id){$(id).hidden=true;$(id).closest(".picker")?.classList.remove("open");if($("projectPickerMenu").hidden&&$("threadPickerMenu").hidden)state.menuOpen=false;}
async function withFeedback(btn,start,done,fn){const text=btn.textContent;btn.disabled=true;btn.textContent=start;setFeedback(start);try{const r=await fn();btn.textContent=done;setFeedback(done);return r}catch(e){btn.textContent="失败";setFeedback(e.message||String(e));throw e}finally{setTimeout(()=>{btn.disabled=false;btn.textContent=text},600)}}
async function fetchCatalog(refresh=false){const json=refresh?await fetch("http://127.0.0.1:40215/api/catalog/refresh?ts="+Date.now(),{method:"POST",headers:{"content-type":"application/json"}}).then(r=>r.json()):await fetch("http://127.0.0.1:40215/api/catalog?ts="+Date.now()).then(r=>r.json());if(!json.ok)throw new Error(json.error?.message||"目录加载失败");state.projects=json.projects||[];state.threads=json.threads||[];state.catalogUpdatedAt=json.updatedAt||"";renderPickers();setStatus(`项目 ${state.projects.length} · 当前项目对话 ${filteredThreads().length} · ${state.catalogUpdatedAt||"未同步"}`);}
async function fetchSessions(){const cur=window.wpsConnectorSessionInfo||{};const key=cur.documentKey||paneDocumentKey();const params=new URLSearchParams({ts:String(Date.now())});if(cur.sessionId)params.set("sessionId",cur.sessionId);else if(key)params.set("documentKey",key);else params.set("onlyOnline","true");const json=await fetch("http://127.0.0.1:40215/api/sessions?"+params.toString()).then(r=>r.json());if(!json.ok)throw new Error(json.error?.message||"会话加载失败");state.sessions=json.sessions||[];state.binding=currentBinding();renderHeader();if(!state.menuOpen)renderPickers();}
async function loadUpdateStatus(remote=false){const q=remote?"refresh=true":"skipRemote=true";const json=await fetch(`http://127.0.0.1:40215/api/update/check?${q}&ts=${Date.now()}`).then(r=>r.json());if(!json.ok)throw new Error(json.error?.message||"检查失败");state.update=json;renderUpdatePanel();return json;}
async function checkUpdate(btn){return withFeedback(btn,"检查中...","已检查",async()=>{const json=await loadUpdateStatus(true);const cur=json.current?.version||"-";const latest=json.latest?.version||"-";const msg=json.updateAvailable?`发现新版本：${cur} -> ${latest}`:json.warning?`远程检查失败：${json.warning.message}`:`当前已是最新版本：${cur}`;setFeedback(msg);return json;});}
async function applyUpdate(btn){return withFeedback(btn,"安装中...","需重启",async()=>{const json=await fetch("http://127.0.0.1:40215/api/update/apply",{method:"POST",headers:{"content-type":"application/json"}}).then(r=>r.json());if(!json.ok)throw new Error(json.error?.message||"更新启动失败");const msg=json.message||"更新安装已开始。安装完成后请重启 WPS 使新版本生效。";setFeedback(msg);setStatus("更新安装中，重启 WPS 后生效");$("updateStatus").textContent="更新安装中，重启 WPS 后生效";$("updateMeta").textContent=msg;return json;});}
function skipUpdate(btn){const latest=state.update?.latest?.version||"";if(!latest){setFeedback("没有可跳过的新版本。");return;}const skipped=latest===skippedUpdateVersion();setSkippedUpdateVersion(skipped?"":latest);renderUpdatePanel();setFeedback(skipped?`已取消跳过 v${latest}`:`已跳过 v${latest}`);}
async function saveBinding(btn){return withFeedback(btn,"保存中...","已保存",async()=>{const s=activeSession();if(!s?.sessionId)throw new Error("当前文档尚未注册");const b=currentBinding()||{};const d=currentDraft();const t=selectedThread();const payload={binding:{...b,projectName:d.project?.label||b.projectName||"",projectPath:d.project?.path||b.projectPath||"",projectId:d.project?.projectId||b.projectId||"",threadId:t?.id||b.threadId||"",threadTitle:threadTitle(t)||b.threadTitle||"",threadCwd:t?.cwd||b.threadCwd||"",documentName:s.documentName||"",documentKey:s.documentKey||"",host:s.host||"",updatedAt:new Date().toISOString()}};const json=await fetch(`http://127.0.0.1:40215/api/sessions/${s.sessionId}/binding`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json());if(!json.ok)throw new Error(json.error?.message||"保存失败");state.binding=json.binding||json.session?.binding||null;await fetchSessions();});}
async function clearBinding(btn){return withFeedback(btn,"清除中...","已清除",async()=>{const s=activeSession();if(!s?.sessionId)throw new Error("当前文档尚未注册");const json=await fetch(`http://127.0.0.1:40215/api/sessions/${s.sessionId}/binding`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({binding:{}})}).then(r=>r.json());if(!json.ok)throw new Error(json.error?.message||"清除失败");state.binding=null;state.drafts[activeSessionKey()]={project:null,thread:null};await fetchSessions();});}
async function setOperationScope(mode,btn){return withFeedback(btn,mode==="selection"?"确认中...":"取消中...",mode==="selection"?"已限定":"已取消",async()=>{const s=activeSession();if(!s?.sessionId)throw new Error("当前文档尚未注册");const context=s.activeContext||{};if(mode==="selection"&&s.host==="wpp"&&!(Number(context.length)>0))throw new Error("当前没有可确认的文字选区");if(mode==="selection"&&s.host==="et"&&!context.address)throw new Error("当前没有可确认的表格选区");const json=await fetch(`http://127.0.0.1:40215/api/sessions/${s.sessionId}/operation-scope`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode,context})}).then(r=>r.json());if(!json.ok)throw new Error(json.error?.message||"操作范围设置失败");await fetchSessions();});}
$("projectPickerButton").onclick=()=>openPicker("projectPickerMenu","projectFilter");$("threadPickerButton").onclick=()=>openPicker("threadPickerMenu","threadFilter");$("projectFilter").oninput=renderProjects;$("threadFilter").oninput=renderThreads;document.addEventListener("click",e=>{if(!$("projectPicker").contains(e.target))closePicker("projectPickerMenu");if(!$("threadPicker").contains(e.target))closePicker("threadPickerMenu");});
$("checkUpdate").onclick=()=>checkUpdate($("checkUpdate"));$("applyUpdate").onclick=()=>applyUpdate($("applyUpdate"));$("skipUpdate").onclick=()=>skipUpdate($("skipUpdate"));$("refreshAll").onclick=()=>withFeedback($("refreshAll"),"刷新中...","已刷新",async()=>{await fetchCatalog(true);await fetchSessions();});$("refreshProjects").onclick=()=>withFeedback($("refreshProjects"),"同步中...","已同步",()=>fetchCatalog(true));$("refreshThreads").onclick=()=>withFeedback($("refreshThreads"),"同步中...","已同步",()=>fetchCatalog(true));$("saveBinding").onclick=()=>saveBinding($("saveBinding"));$("clearBinding").onclick=()=>clearBinding($("clearBinding"));$("confirmScope").onclick=()=>setOperationScope("selection",$("confirmScope"));$("clearScope").onclick=()=>setOperationScope("document",$("clearScope"));window.addEventListener("wpsConnectorStateChanged",()=>fetchSessions().catch(()=>{}));
Promise.resolve().then(async()=>{try{await Promise.all([loadUpdateStatus(false),fetchCatalog(),fetchSessions()]);setFeedback("已就绪。");}catch(e){setFeedback(e.message||String(e));setStatus("加载失败");}finally{renderHeader();renderPickers();renderUpdatePanel();}});
</script>
